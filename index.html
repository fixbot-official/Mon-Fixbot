<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixBot PRO - Assistant de Réparation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-orange-600 p-2 rounded-lg text-white">
                <i class="fa-solid fa-wrench text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">FixBot <span class="text-xs bg-orange-600/30 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">PRO</span></h1>
                <p class="text-xs text-slate-400">Assistant Diagnostic & Matériel</p>
            </div>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between" style="height: calc(100vh - 70px);">
        <div id="chatBox" class="flex-1 overflow-y-auto space-y-4 pr-2 mb-4">
            <!-- Message de bienvenue -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm">
                <div class="flex items-start space-x-3">
                    <div class="bg-orange-600/20 text-orange-400 p-2 rounded-lg">
                        <i class="fa-solid fa-robot text-lg"></i>
                    </div>
                    <div class="flex-1">
                        <h2 class="font-semibold text-orange-400 mb-1">Bienvenue sur FixBot !</h2>
                        <p class="text-sm text-slate-300">Décris-moi ton problème de bricolage ou d'électroménager, je suis prêt à t'aider.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-2 flex items-center space-x-2">
            <input type="text" id="userInput" placeholder="Ex: Ma machine à laver ne vidange plus..." class="flex-1 bg-transparent text-slate-100 placeholder-slate-500 px-3 py-2 focus:outline-none text-sm">
            <button id="sendBtn" class="bg-orange-600 hover:bg-orange-500 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center space-x-2 transition">
                <span>Envoyer</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </main>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6JcYopYMOO2SkXHBSDHmi86qKs9WaD-rqx-pfLR1q8btw";
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { 
            if (e.key === 'Enter') sendMessage(); 
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            const loadingId = 'loading-' + Date.now();
            const loader = document.createElement('div');
            loader.id = loadingId;
            loader.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 text-slate-400 text-sm';
            loader.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-orange-500 mr-2"></i> Analyse en cours...';
            chatBox.appendChild(loader);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ role: 'user', parts: [{ text: "Tu es FixBot PRO, un expert en bricolage. Réponds de façon claire et structurée à cette question : " + text }] }]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.candidates && data.candidates.length > 0) {
                    const botReply = data.candidates[0].content.parts[0].text;
                    appendMessage('bot', botReply);
                } else if (data.error) {
                    appendMessage('bot', "Erreur de l'API : " + data.error.message);
                } else {
                    appendMessage('bot', "Réponse reçue vide de l'API.");
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                appendMessage('bot', "Erreur réseau : impossible de joindre Gemini.");
            }
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            if (sender === 'user') {
                msgDiv.className = 'flex justify-end';
                msgDiv.innerHTML = `<div class="bg-orange-600 text-white rounded-xl py-2 px-4 max-w-lg text-sm">${escapeHtml(text)}</div>`;
            } else {
                msgDiv.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm space-y-2';
                msgDiv.innerHTML = `
                    <div class="text-orange-400 font-semibold text-sm"><i class="fa-solid fa-robot mr-1"></i> FixBot</div>
                    <div class="text-sm text-slate-200 leading-relaxed">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
                `;
            }
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
