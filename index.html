<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixBot PRO - Assistant de Réparation & Bricolage</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .chat-container { height: calc(100vh - 160px); }
        .affiliate-btn {
            transition: all 0.2s ease-in-out;
        }
        .affiliate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex justify-between items-center sticky top-0 z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-orange-600 p-2 rounded-lg text-white">
                <i class="fa-solid fa-wrench text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg leading-tight">FixBot <span class="text-xs bg-orange-600/30 text-orange-400 px-2 py-0.5 rounded-full border border-orange-500/30">PRO</span></h1>
                <p class="text-xs text-slate-400">Assistant Diagnostic & Matériel</p>
            </div>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
        <div id="chatBox" class="chat-container overflow-y-auto space-y-4 pr-2">
            <!-- Message de bienvenue -->
            <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm">
                <div class="flex items-start space-x-3">
                    <div class="bg-orange-600/20 text-orange-400 p-2 rounded-lg">
                        <i class="fa-solid fa-robot text-lg"></i>
                    </div>
                    <div class="flex-1">
                        <h2 class="font-semibold text-orange-400 mb-1">Bienvenue sur FixBot !</h2>
                        <p class="text-sm text-slate-300">Décris-moi ton problème de bricolage, d'électroménager ou d'électronique. Je vais t'aider à diagnostiquer la panne et te recommander les outils et pièces nécessaires.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="mt-4 bg-slate-800 border border-slate-700 rounded-xl p-2 flex items-center space-x-2">
            <input type="text" id="userInput" placeholder="Ex: Ma machine à laver ne vidange plus..." class="flex-1 bg-transparent text-slate-100 placeholder-slate-500 px-3 py-2 focus:outline-none text-sm">
            <button id="sendBtn" class="bg-orange-600 hover:bg-orange-500 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center space-x-2 transition">
                <span>Envoyer</span>
                <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
        </div>
    </main>

    <script>
        // CONFIGURATION
        // Colle ta clé API Gemini entre les guillemets ci-dessous :
        const GEMINI_API_KEY = "AQ.Ab8RN6JcYopYMOO2SkXHBSDHmi86qKs9WaD-rqx-pfLR1q8btw";
        
        // Ton Tag d'affilié Amazon :
        const AMAZON_TAG = "fixbotpro-21";

      
        const EQUIPMENT_KEYWORDS = [
            "tournevis", "multimètre", "fer à souder", "étain", "pince", "clé a molette",
            "condensateur", "fusible", "joint", "courroie", "pompe de vidange", "résistance",
            "thermostat", "interrupteur", "relais", "testeur de tension", "colle epoxy",
            "dégrippant", "wd-40", "gaine thermique", "connecteur", "vis", "boulon",
            "moteur", "carte électronique", "batterie", "chargeur", "fil de cuivre"
        ];

        // System Prompt pour Gemini
        const SYSTEM_PROMPT = `Tu es FixBot PRO, un expert mondial en bricolage, réparation d'électroménager, électronique et mécanique.
Tes réponses doivent être claires, pédagogiques, structurées et bienveillantes.
Quand tu diagnostiques un problème :
1. Explique les causes possibles de façon simple.
2. Propose des étapes de réparation sécurisées pas à pas.
3. Liste TOUJOURS explicitement les **outils nécessaires** et les **pièces de rechange éventuelles** sous forme de puces claires.
Maintiens un ton professionnel et encourageant.`;

        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Envoi Message
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Ajouter le message utilisateur
            appendMessage('user', text);
            userInput.value = '';

            // Indicateur de chargement
            const loadingId = appendLoading();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            { role: 'user', parts: [{ text: SYSTEM_PROMPT + "\n\nQuestion de l'utilisateur: " + text }] }
                        ]
                    })
                });

                const data = await response.json();
                document.getElementById(loadingId)?.remove();

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const replyText = data.candidates[0].content.parts[0].text;
                    appendMessage('bot', replyText);
                } else {
                    appendMessage('bot', "Désolé, une erreur s'est produite lors du traitement de la réponse.");
                }
            } catch (err) {
                document.getElementById(loadingId)?.remove();
                appendMessage('bot', "Erreur de connexion avec l'API Gemini. Vérifiez la clé API.");
            }
        }

        function appendMessage(sender, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = sender === 'user' 
                ? 'flex justify-end' 
                : 'bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm space-y-3';

            if (sender === 'user') {
                msgDiv.innerHTML = `<div class="bg-orange-600 text-white rounded-xl py-2 px-4 max-w-lg text-sm">${escapeHtml(text)}</div>`;
            } else {
                const formattedHtml = marked.parse(text);
                msgDiv.innerHTML = `
                    <div class="flex items-center space-x-2 text-orange-400 font-semibold text-sm">
                        <i class="fa-solid fa-robot"></i>
                        <span>FixBot</span>
                    </div>
                    <div class="text-sm text-slate-200 leading-relaxed prose prose-invert max-w-none">${formattedHtml}</div>
                `;

                // Détecter les équipements et ajouter les boutons d'affiliation
                const detectedItems = detectEquipment(text);
                if (detectedItems.length > 0) {
                    const affiliateCard = createAffiliateCard(detectedItems);
                    msgDiv.appendChild(affiliateCard);
                }
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const loader = document.createElement('div');
            loader.id = id;
            loader.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 flex items-center space-x-3 text-slate-400 text-sm';
            loader.innerHTML = `
                <i class="fa-solid fa-circle-notch fa-spin text-orange-500"></i>
                <span>Analyse de votre problème en cours...</span>
            `;
            chatBox.appendChild(loader);
            chatBox.scrollTop = chatBox.scrollHeight;
            return id;
        }

        // Détection de matériel dans la réponse
        function detectEquipment(text) {
            const lowerText = text.toLowerCase();
            const found = new Set();

            EQUIPMENT_KEYWORDS.forEach(keyword => {
                if (lowerText.includes(keyword)) {
                    found.add(keyword.charAt(0).toUpperCase() + keyword.slice(1));
                }
            });

            return Array.from(found);
        }

        // Création du bloc de liens affiliés
        function createAffiliateCard(items) {
            const card = document.createElement('div');
            card.className = "mt-4 pt-3 border-t border-slate-700/80 bg-slate-900/50 rounded-lg p-3";
            
            let buttonsHtml = items.map(item => {
                const searchUrl = `https://www.amazon.fr/s?k=${encodeURIComponent(item)}&tag=${AMAZON_TAG}`;
                return `
                    <a href="${searchUrl}" target="_blank" rel="noopener noreferrer" 
                       class="affiliate-btn inline-flex items-center space-x-2 bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white text-xs font-medium px-3 py-1.5 rounded-md shadow-sm">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Trouver ${item}</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px] opacity-80"></i>
                    </a>
                `;
            }).join('');

            card.innerHTML = `
                <div class="flex items-center space-x-2 text-xs font-medium text-slate-400 mb-2">
                    <i class="fa-solid fa-toolbox text-orange-400"></i>
                    <span>Matériel recommandé pour cette réparation :</span>
                </div>
                <div class="flex flex-wrap gap-2">
                    ${buttonsHtml}
                </div>
            `;

            return card;
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
