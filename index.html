<script>
    const GEMINI_API_KEY = "AQ.Ab8RN6JcYopYMOO2SkXHBSDHmi86qKs9WaD-rqx-pfLR1q8btw";
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => { 
        if (e.key === 'Enter') sendMessage(); 
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage('user', text);
        userInput.value = '';

        const loadingId = 'loading-' + Date.now();
        const loader = document.createElement('div');
        loader.id = loadingId;
        loader.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 text-slate-400 text-sm';
        loader.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin text-orange-500 mr-2"></i> Analyse en cours...';
        chatBox.appendChild(loader);
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text: "Tu es FixBot PRO, un expert en bricolage et réparation. Réponds de façon claire et structurée à cette demande : " + text }] }]
                })
            });

            const data = await response.json();
            document.getElementById(loadingId)?.remove();

            // Extraction sécurisée du texte de la réponse
            let botReply = "Désolé, je n'ai pas pu générer de réponse.";
            if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
                botReply = data.candidates[0].content.parts[0].text;
            } else if (data.error) {
                botReply = "Erreur API : " + (data.error.message || "Requête invalide");
            }

            appendMessage('bot', botReply);
        } catch (err) {
            document.getElementById(loadingId)?.remove();
            appendMessage('bot', "Erreur de connexion réseau.");
        }
    }

    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        if (sender === 'user') {
            msgDiv.className = 'flex justify-end';
            msgDiv.innerHTML = `<div class="bg-orange-600 text-white rounded-xl py-2 px-4 max-w-lg text-sm">${escapeHtml(text)}</div>`;
        } else {
            msgDiv.className = 'bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-sm space-y-2';
            msgDiv.innerHTML = `
                <div class="text-orange-400 font-semibold text-sm"><i class="fa-solid fa-robot mr-1"></i> FixBot</div>
                <div class="text-sm text-slate-200 leading-relaxed">${escapeHtml(text).replace(/\n/g, '<br>')}</div>
            `;
        }
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>
